[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-triage"
version = "0.1.0"
description = "Triage of financial consumer complaints: TF-IDF baseline vs. LLM, with cost-aware hybrid routing"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy", "scikit-learn>=1.3", "matplotlib"]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
